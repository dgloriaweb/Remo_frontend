services:
  frontend:
    build: .
    ports:
      - "5175:5175"
    environment:
      # Reach host machine backend from inside Docker on Linux.
      - VITE_API_BASE_URL=/api
      - VITE_AUTH_LOGIN_PATH=/login
      - VITE_AUTH_REGISTER_PATH=/register
      - VITE_DB_API_BASE_URL=/api
      - VITE_DEV_PROXY_TARGET=http://host.docker.internal:8083
      - CHOKIDAR_USEPOLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules

  frontend_prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5175:5175"

